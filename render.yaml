# Fallback deploy target. Railway (Dockerfile + railway.json) is primary.
services:
  - type: web
    name: roadie
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render's edge proxy is the only route to the container, so trusting
      # its X-Forwarded-For is safe here. Do not copy this to a host where
      # the port is directly reachable.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: roadie
